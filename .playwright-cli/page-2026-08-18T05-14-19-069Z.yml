              - strong [ref=f2e69]: Make contribution easier
              - paragraph [ref=f2e70]: Give embedded developers a focused starting point for testing, observing, and extending the serial workflow.
        - region [ref=f2e71]:
          - generic [ref=f2e72]:
            - paragraph [ref=f2e73]: What ships inside
            - heading "One workspace for the whole serial loop." [level=2] [ref=f2e74]
            - paragraph [ref=f2e75]: From the first port discovery to the final exported log, BaudTide keeps embedded debugging readable and close to the device.
          - generic [ref=f2e76]:
            - article [ref=f2e77]:
              - text: 01 / DISCOVER
              - heading "Find the port faster" [level=3] [ref=f2e78]
              - paragraph [ref=f2e79]: Discover available serial ports automatically or enter a path manually when your hardware setup calls for it.
            - article [ref=f2e80]:
              - text: 02 / MONITOR
              - heading "Keep several devices open" [level=3] [ref=f2e81]
              - paragraph [ref=f2e82]: Work across multiple devices in tabs or side-by-side terminal views, with connection settings kept per session.
            - article [ref=f2e83]:
              - text: 03 / VISUALIZE
              - heading "Turn telemetry into a signal" [level=3] [ref=f2e84]
              - paragraph [ref=f2e85]: Detect structured telemetry from live serial output and visualize selected numeric fields without leaving the terminal.
            - article [ref=f2e86]:
              - text: 04 / SEND
              - heading "Speak text or hexadecimal" [level=3] [ref=f2e87]
              - paragraph [ref=f2e88]: Send text or raw hexadecimal data with configurable line endings and per-device connection settings.
            - article [ref=f2e89]:
              - text: 05 / CAPTURE
              - heading "Never lose the raw log" [level=3] [ref=f2e90]
              - paragraph [ref=f2e91]: Pause or filter noisy output while capture continues, then browse, search, preview, export, or delete local logs.
            - article [ref=f2e92]:
              - text: 06 / RETURN
              - heading "Save the setup you trust" [level=3] [ref=f2e93]
              - paragraph [ref=f2e94]: Name terminal layouts and return to the workspace that already matches your board, cable, and test routine.
            - article [ref=f2e95]:
              - text: 07 / SHARE
              - heading "Bring a phone into the loop" [level=3] [ref=f2e96]
              - paragraph [ref=f2e97]: Share live output or read-only snapshots over a local network with QR-code links and explicit remote-control opt-in.
            - article [ref=f2e98]:
              - text: 08 / ADAPT
              - heading "Choose your workspace" [level=3] [ref=f2e99]
              - paragraph [ref=f2e100]: Switch between dark and light themes while keeping the same device-first workflow in view.
