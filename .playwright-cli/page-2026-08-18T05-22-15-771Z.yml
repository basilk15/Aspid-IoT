              - generic [ref=f7e60]: "01"
              - strong [ref=f7e61]: Build in public
              - paragraph [ref=f7e62]: Let the roadmap, issues, and implementation stay visible to the people building with connected hardware.
            - generic [ref=f7e63]:
              - generic [ref=f7e64]: "02"
              - strong [ref=f7e65]: Keep the signal local
              - paragraph [ref=f7e66]: Capture raw device output on the machine where the work is happening, with exports when the team needs them.
            - generic [ref=f7e67]:
              - generic [ref=f7e68]: "03"
              - strong [ref=f7e69]: Make contribution easier
              - paragraph [ref=f7e70]: Give embedded developers a focused starting point for testing, observing, and extending the serial workflow.
        - region [ref=f7e71]:
          - generic [ref=f7e72]:
            - paragraph [ref=f7e73]: What ships inside
            - heading "One workspace for the whole serial loop." [level=2] [ref=f7e74]
            - paragraph [ref=f7e75]: From the first port discovery to the final exported log, BaudTide keeps embedded debugging readable and close to the device.
          - generic [ref=f7e76]:
            - article [ref=f7e77]:
              - text: 01 / DISCOVER
              - heading "Find the port faster" [level=3] [ref=f7e78]
              - paragraph [ref=f7e79]: Discover available serial ports automatically or enter a path manually when your hardware setup calls for it.
            - article [ref=f7e80]:
              - text: 02 / MONITOR
              - heading "Keep several devices open" [level=3] [ref=f7e81]
              - paragraph [ref=f7e82]: Work across multiple devices in tabs or side-by-side terminal views, with connection settings kept per session.
            - article [ref=f7e83]:
              - text: 03 / VISUALIZE
              - heading "Turn telemetry into a signal" [level=3] [ref=f7e84]
              - paragraph [ref=f7e85]: Detect structured telemetry from live serial output and visualize selected numeric fields without leaving the terminal.
            - article [ref=f7e86]:
              - text: 04 / SEND
              - heading "Speak text or hexadecimal" [level=3] [ref=f7e87]
              - paragraph [ref=f7e88]: Send text or raw hexadecimal data with configurable line endings and per-device connection settings.
            - article [ref=f7e89]:
              - text: 05 / CAPTURE
              - heading "Never lose the raw log" [level=3] [ref=f7e90]
              - paragraph [ref=f7e91]: Pause or filter noisy output while capture continues, then browse, search, preview, export, or delete local logs.
            - article [ref=f7e92]:
              - text: 06 / RETURN
              - heading "Save the setup you trust" [level=3] [ref=f7e93]
              - paragraph [ref=f7e94]: Name terminal layouts and return to the workspace that already matches your board, cable, and test routine.
            - article [ref=f7e95]:
              - text: 07 / SHARE
              - heading "Bring a phone into the loop" [level=3] [ref=f7e96]
              - paragraph [ref=f7e97]: Share live output or read-only snapshots over a local network with QR-code links and explicit remote-control opt-in.
            - article [ref=f7e98]:
              - text: 08 / ADAPT
              - heading "Choose your workspace" [level=3] [ref=f7e99]
              - paragraph [ref=f7e100]: Switch between dark and light themes while keeping the same device-first workflow in view.
