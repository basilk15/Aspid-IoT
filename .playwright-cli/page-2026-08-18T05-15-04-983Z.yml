              - generic [ref=f3e68]: "03"
              - strong [ref=f3e69]: Make contribution easier
              - paragraph [ref=f3e70]: Give embedded developers a focused starting point for testing, observing, and extending the serial workflow.
        - region [ref=f3e71]:
          - generic [ref=f3e72]:
            - paragraph [ref=f3e73]: What ships inside
            - heading "One workspace for the whole serial loop." [level=2] [ref=f3e74]
            - paragraph [ref=f3e75]: From the first port discovery to the final exported log, BaudTide keeps embedded debugging readable and close to the device.
          - generic [ref=f3e76]:
            - article [ref=f3e77]:
              - text: 01 / DISCOVER
              - heading "Find the port faster" [level=3] [ref=f3e78]
              - paragraph [ref=f3e79]: Discover available serial ports automatically or enter a path manually when your hardware setup calls for it.
            - article [ref=f3e80]:
              - text: 02 / MONITOR
              - heading "Keep several devices open" [level=3] [ref=f3e81]
              - paragraph [ref=f3e82]: Work across multiple devices in tabs or side-by-side terminal views, with connection settings kept per session.
            - article [ref=f3e83]:
              - text: 03 / VISUALIZE
              - heading "Turn telemetry into a signal" [level=3] [ref=f3e84]
              - paragraph [ref=f3e85]: Detect structured telemetry from live serial output and visualize selected numeric fields without leaving the terminal.
            - article [ref=f3e86]:
              - text: 04 / SEND
              - heading "Speak text or hexadecimal" [level=3] [ref=f3e87]
              - paragraph [ref=f3e88]: Send text or raw hexadecimal data with configurable line endings and per-device connection settings.
            - article [ref=f3e89]:
              - text: 05 / CAPTURE
              - heading "Never lose the raw log" [level=3] [ref=f3e90]
              - paragraph [ref=f3e91]: Pause or filter noisy output while capture continues, then browse, search, preview, export, or delete local logs.
            - article [ref=f3e92]:
              - text: 06 / RETURN
              - heading "Save the setup you trust" [level=3] [ref=f3e93]
              - paragraph [ref=f3e94]: Name terminal layouts and return to the workspace that already matches your board, cable, and test routine.
            - article [ref=f3e95]:
              - text: 07 / SHARE
              - heading "Bring a phone into the loop" [level=3] [ref=f3e96]
              - paragraph [ref=f3e97]: Share live output or read-only snapshots over a local network with QR-code links and explicit remote-control opt-in.
            - article [ref=f3e98]:
              - text: 08 / ADAPT
              - heading "Choose your workspace" [level=3] [ref=f3e99]
              - paragraph [ref=f3e100]: Switch between dark and light themes while keeping the same device-first workflow in view.
