            - heading "Tools for the bench should belong to the community using them." [level=2] [ref=f3e56]
            - paragraph [ref=f3e57]: "BaudTide is our contribution to the greater IoT community: a public, inspectable workspace for the everyday work between a board, a serial line, and the engineer trying to understand what just happened."
