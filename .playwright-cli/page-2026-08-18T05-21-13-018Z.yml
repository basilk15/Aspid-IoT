              - generic [ref=f5e83]: "02"
              - strong [ref=f5e84]: Keep the signal local
              - paragraph [ref=f5e85]: Capture raw device output on the machine where the work is happening, with exports when the team needs them.
            - generic [ref=f5e86]:
              - generic [ref=f5e87]: "03"
              - strong [ref=f5e88]: Make contribution easier
              - paragraph [ref=f5e89]: Give embedded developers a focused starting point for testing, observing, and extending the serial workflow.
        - region [ref=f5e90]:
          - generic [ref=f5e91]:
            - paragraph [ref=f5e92]: What ships inside
            - heading "One workspace for the whole serial loop." [level=2] [ref=f5e93]
            - paragraph [ref=f5e94]: From the first port discovery to the final exported log, BaudTide keeps embedded debugging readable and close to the device.
          - generic [ref=f5e95]:
            - article [ref=f5e96]:
              - text: 01 / DISCOVER
              - heading "Find the port faster" [level=3] [ref=f5e97]
              - paragraph [ref=f5e98]: Discover available serial ports automatically or enter a path manually when your hardware setup calls for it.
            - article [ref=f5e99]:
              - text: 02 / MONITOR
              - heading "Keep several devices open" [level=3] [ref=f5e100]
              - paragraph [ref=f5e101]: Work across multiple devices in tabs or side-by-side terminal views, with connection settings kept per session.
            - article [ref=f5e102]:
              - text: 03 / VISUALIZE
              - heading "Turn telemetry into a signal" [level=3] [ref=f5e103]
              - paragraph [ref=f5e104]: Detect structured telemetry from live serial output and visualize selected numeric fields without leaving the terminal.
            - article [ref=f5e105]:
              - text: 04 / SEND
              - heading "Speak text or hexadecimal" [level=3] [ref=f5e106]
              - paragraph [ref=f5e107]: Send text or raw hexadecimal data with configurable line endings and per-device connection settings.
            - article [ref=f5e108]:
              - text: 05 / CAPTURE
              - heading "Never lose the raw log" [level=3] [ref=f5e109]
              - paragraph [ref=f5e110]: Pause or filter noisy output while capture continues, then browse, search, preview, export, or delete local logs.
            - article [ref=f5e111]:
              - text: 06 / RETURN
              - heading "Save the setup you trust" [level=3] [ref=f5e112]
              - paragraph [ref=f5e113]: Name terminal layouts and return to the workspace that already matches your board, cable, and test routine.
            - article [ref=f5e114]:
              - text: 07 / SHARE
              - heading "Bring a phone into the loop" [level=3] [ref=f5e115]
              - paragraph [ref=f5e116]: Share live output or read-only snapshots over a local network with QR-code links and explicit remote-control opt-in.
            - article [ref=f5e117]:
              - text: 08 / ADAPT
              - heading "Choose your workspace" [level=3] [ref=f5e118]
              - paragraph [ref=f5e119]: Switch between dark and light themes while keeping the same device-first workflow in view.
